<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Contact us for feedback, reports, or partnership opportunities.">
  <title>Contact Us</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff7ed;color:#1f2937;line-height:1.8}
    .wrap{max-width:760px;margin:auto;padding:16px}
    .card{background:#fff;border:1px solid #fed7aa;border-radius:14px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
    .mail{font-weight:700;word-break:break-word}
    a{color:#c2410c;text-decoration:none}
    .small{font-size:.95rem;color:#4b5563}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Contact Us</h1>
      <p>For questions about content, advertising, or usage rights, email us at:</p>
      <p class="mail">contact@xf9.store</p>
      <p class="small">We usually reply within 2 business days.</p>
      <p><a href="index.php">Back to home</a></p>
    </section>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.js"></script>
  <script>
    window.addEventListener('load', function () {
      if (window.cookieconsent) {
        window.cookieconsent.initialise({
          palette: {
            popup: { background: '#1f2937' },
            button: { background: '#f59e0b' }
          },
          theme: 'classic',
          position: 'bottom',
          content: {
            message: 'We use cookies to improve your experience and serve internationally relevant ads.',
            dismiss: 'Accept',
            link: 'Privacy Policy',
            href: 'privercy.html'
          }
        });
      }
    });
  </script>
</body>
</html>
